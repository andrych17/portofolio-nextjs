<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A1A" />
      <stop offset="100%" stop-color="#FF3E00" />
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="bgBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="#0C0C0E" />
  
  <!-- Ambient Inner Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />
  
  <!-- Subtle Border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#bgBorder)" stroke-width="6" />

  <!-- Letter A (Andry) -->
  <path d="M 98 376 L 194 136 L 290 376" fill="none" stroke="url(#aGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="136" y1="296" x2="252" y2="296" stroke="url(#aGrad)" stroke-width="36" stroke-linecap="round" />

  <!-- Letter H (Huang) -->
  <line x1="328" y1="136" x2="328" y2="376" stroke="url(#hGrad)" stroke-width="36" stroke-linecap="round" />
  <line x1="414" y1="136" x2="414" y2="376" stroke="url(#hGrad)" stroke-width="36" stroke-linecap="round" />
  <line x1="328" y1="256" x2="414" y2="256" stroke="url(#hGrad)" stroke-width="36" stroke-linecap="round" />
</svg>
